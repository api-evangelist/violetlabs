description: 'Violet Labs operates an official hosted (remote) Model Context Protocol server that gives
  agents secure access to a workspace''s structured Violet data — to answer questions, build insights,
  and assemble dashboards. Two environments are published: the standard cloud server and a VioletGov server
  for ITAR/regulated tenants. Authentication is via OAuth (recommended: authenticate with existing Violet
  credentials and select a workspace) or an API key passed in the X-API-Key header (for clients like Cursor
  and Windsurf). The OAuth flow is backed by the app.violetlabs.com authorization server (PKCE S256, dynamic
  client registration, scope: mcp) — see well-known/violetlabs-oauth-authorization-server.json.'
server:
  name: violet
  transport: http
  url: https://mcp.violetlabs.com/mcp
  auth: oauth2
  authorization_server: https://app.violetlabs.com
  scopes:
  - mcp
  api_key_header: X-API-Key
