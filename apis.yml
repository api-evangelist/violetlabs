aid: violetlabs
name: Violetlabs
description: >-
  Violet Labs is the connective tissue for hardware engineering data. Its
  cloud platform gives hardware, systems, and manufacturing teams a single
  workspace that harmonizes the software stack — PLM, ERP, CAD, PDM, MES,
  requirements, and procurement tools — through no-code integrations, data-sync
  workflows, parameters, native Python/Julia/MATLAB scripts, requirements
  management, reporting, and dashboards. Violet exposes a REST API (the Explore
  endpoint) authenticated with an x-api-key header, an OAuth 2.0 authorization
  server with dynamic client registration for its hosted Model Context Protocol
  (MCP) server, and an AI chat/agent surface. The platform is ITAR/EAR-aware,
  SOC 2 certified, and NIST/CMMC/FedRAMP-aligned, with on-premises and VioletGov
  deployment options for defense and regulated hardware programs.
