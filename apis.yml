apis:
- name: Violet Explore API
  description: >-
    REST API for programmatic access to your Violet data. The Explore endpoint
    (POST /api/explore) accepts a rich query payload (keyword, filterModel,
    sort, grouping, pagination) and returns a paginated PageDto of entities.
    Authenticated with an x-api-key header. The API is served per-tenant at
    https://{tenant}.violetlabs.com/api (or {tenant}.violetgov.com/api for
    VioletGov), with .staging. subdomain variants for staging.
